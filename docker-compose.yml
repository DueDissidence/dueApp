services:

  traefik:
    container_name: traefik
    image: traefik:v3.6
    restart: always
    command:
      - --api=true
      - --entrypoints.http.address=:80
      - --entrypoints.https.address=:443
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.https.forwardedHeaders.trustedIPs=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/12,172.64.0.0/13,131.0.72.0/22
      - --certificatesresolvers.cf.acme.caserver=https://acme-v02.api.letsencrypt.org/directory
      - --certificatesresolvers.cf.acme.email=${CF_API_EMAIL}
      - --certificatesresolvers.cf.acme.storage=/acme.json
      - --certificatesresolvers.cf.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.cf.acme.dnschallenge=true
    ports:
      - "80:80"
      - "443:443"
    networks:
      - web
      - local
    env_file:
      - .env
    environment:
      - CF_API_EMAIL=${CF_API_EMAIL}
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    volumes:
      - ./traefik/acme.json:/acme.json
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/timezone:/etc/timezone:ro
    labels:
      - traefik.http.routers.http-catchall.entrypoints=http
      - traefik.http.routers.http-catchall.rule=hostregexp(`{host:.+}`)
      - traefik.http.routers.http-catchall.middlewares=redirect-to-https
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
      - traefik.enable=true
      - traefik.http.routers.dashboard.tls=true
      - traefik.http.routers.dashboard.entrypoints=https
      - traefik.http.routers.dashboard.rule=Host(`tf.${DOMAINNAME}`)
      - traefik.http.routers.dashboard.service=api@internal
      - traefik.http.routers.dashboard.tls.certresolver=cf
      - traefik.http.routers.dashboard.middlewares=authtraefik
      - traefik.http.middlewares.authtraefik.basicauth.users=${BASICAUTH}

  backend:
    container_name: backend
    build:
      context: ./backend
      target: production
    working_dir: /backend
    user: "${PUID}:${PGID}"
    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO
    volumes:
      - /etc/timezone:/etc/timezone:ro
    restart: unless-stopped
    networks:
      - web
    env_file:
      - .env
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.backend.tls=true
      - traefik.http.routers.backend.entrypoints=https
      - traefik.http.routers.backend.rule=Host(`app.${DOMAINNAME}`) && PathPrefix(`/api`)
      - traefik.http.routers.backend.priority=100
      - traefik.http.routers.backend.middlewares=backend-strip
      - traefik.http.middlewares.backend-strip.stripprefix.prefixes=/api
      - traefik.http.services.backend.loadbalancer.server.port=8000

  frontend:
    container_name: frontend
    build:
      context: ./frontend
      target: production
    working_dir: /frontend
    volumes:
      - /etc/timezone:/etc/timezone:ro
    restart: unless-stopped
    networks:
      - web
    env_file:
      - .env
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.frontend.tls=true
      - traefik.http.routers.frontend.entrypoints=https
      - traefik.http.routers.frontend.rule=Host(`app.${DOMAINNAME}`)
      - traefik.http.services.frontend.loadbalancer.server.port=80
      - traefik.http.routers.frontend.tls.certresolver=cf

networks:
  web:
    name: "web"
    ipam:
      config:
        - subnet: 172.20.0.0/24
  local:
    name: "local"
    ipam:
      config:
        - subnet: 172.20.1.0/24
